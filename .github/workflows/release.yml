# Creates a GitHub release when a version tag (e.g. 0.6.0) is pushed.
#
# Before tagging:
#   1. set "version" in package.json to the new version
#   2. add a "## vX.Y.Z (date)" section to CHANGELOG.md (it becomes the release notes)
#   3. commit, then: git tag X.Y.Z && git push origin main X.Y.Z
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test

      - name: Check package.json version matches the tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json version ($version) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            $0 ~ "^## v" ver "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '## v$GITHUB_REF_NAME' section in CHANGELOG.md"
            exit 1
          fi

      - run: yarn build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/cover-slider.js --title "$GITHUB_REF_NAME" --notes-file release-notes.md
